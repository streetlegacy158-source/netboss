<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netboss - Automated Data Bundles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400">⚡ Netboss Hub</h1>
            <div class="flex items-center space-x-4 text-sm">
                <a href="{{ store.whatsappChannel }}" target="_blank" class="bg-green-600 hover:bg-green-500 px-3 py-1.5 rounded-lg font-medium transition">Join WhatsApp Channel</a>
                <a href="mailto:{{ store.email }}" class="text-gray-300 hover:text-white transition">Support</a>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow grid grid-cols-1 md:grid-cols-2 gap-6 my-6">
        
        <!-- Order Form Card -->
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
            <h2 class="text-lg font-semibold mb-4 text-emerald-300">Buy Data Bundle</h2>
            <form id="paymentForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Phone Number (Ghana)</label>
                    <input type="text" id="phoneNumber" placeholder="0241234567" required
                           class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Network</label>
                    <select id="network" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="YELLO">MTN (YELLO)</option>
                        <option value="TELECEL">Telecel</option>
                        <option value="AT_PREMIUM">AirtelTigo (AT)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Capacity & Price</label>
                    <select id="capacity" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="1" data-price="5">1 GB - GH₵ 5.00</option>
                        <option value="2" data-price="10">2 GB - GH₵ 10.00</option>
                        <option value="5" data-price="24.5">5 GB - GH₵ 24.50</option>
                        <option value="10" data-price="48">10 GB - GH₵ 48.00</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg transition shadow-lg">
                    Pay & Deliver Instantly
                </button>
            </form>
        </div>

        <!-- Dashboard / Tracker Card -->
        <div class="space-y-6">
            <!-- Wallet Balance Card -->
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-semibold text-emerald-300">Wallet & Store Status</h2>
                    <button onclick="fetchWalletBalance()" class="text-xs bg-gray-700 hover:bg-gray-600 px-2.5 py-1 rounded transition">Refresh</button>
                </div>
                <div id="walletDisplay" class="text-sm space-y-2 text-gray-300">
                    <p>Deposit Balance: <span id="depositBalance" class="font-bold text-white">Loading...</span></p>
                    <p>Earnings Balance: <span id="earningsBalance" class="font-bold text-white">Loading...</span></p>
                </div>
            </div>

            <!-- Order Lookup Card -->
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <h2 class="text-lg font-semibold mb-3 text-emerald-300">Track Order Status</h2>
                <div class="flex space-x-2 mb-3">
                    <input type="text" id="orderRef" placeholder="Enter Reference (e.g. API-...)"
                           class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-white focus:ring-2 focus:ring-emerald-500 outline-none">
                    <button onclick="checkOrderStatus()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-semibold transition">Track</button>
                </div>
                <div id="orderResult" class="text-xs bg-gray-900 p-3 rounded-lg border border-gray-800 text-gray-400 font-mono hidden"></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 border-t border-gray-700 text-center py-4 text-xs text-gray-400">
        <p>&copy; 2026 Netboss Hub. Contact Support: <a href="mailto:{{ store.email }}" class="text-emerald-400 underline">{{ store.email }}</a></p>
    </footer>

    <script>
        // Fetch wallet balance on load
        async function fetchWalletBalance() {
            try {
                const res = await fetch('/api/wallet/balance');
                const data = await res.json();
                if (data.status === 'success') {
                    document.getElementById('depositBalance').innerText = `${data.data.deposit.currency} ${data.data.deposit.balance.toFixed(2)}`;
                    document.getElementById('earningsBalance').innerText = `${data.data.earnings.currency} ${data.data.earnings.availableBalance.toFixed(2)}`;
                }
            } catch (err) {
                console.error(err);
            }
        }
        fetchWalletBalance();

        // Check order status by reference
        async function checkOrderStatus() {
            const ref = document.getElementById('orderRef').value.trim();
            const resultBox = document.getElementById('orderResult');
            if (!ref) return;
            resultBox.classList.remove('hidden');
            resultBox.innerText = "Checking...";
            try {
                const res = await fetch(`/api/orders/${ref}`);
                const data = await res.json();
                resultBox.innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                resultBox.innerText = "Error fetching order status.";
            }
        }

        // Payment Checkout Handler
        document.getElementById("paymentForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const phoneNumber = document.getElementById("phoneNumber").value;
            const network = document.getElementById("network").value;
            const capacitySelect = document.getElementById("capacity");
            const capacity = capacitySelect.value;
            const amountInGHS = parseFloat(capacitySelect.options[capacitySelect.selectedIndex].getAttribute("data-price"));
            const amountInPesewas = Math.round(amountInGHS * 100);

            try {
                const initRes = await fetch('/api/initialize-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber, network, capacity, amount: amountInPesewas })
                });
                const initData = await initRes.json();

                if (initData.status && initData.data.authorization_url) {
                    const handler = PaystackPop.setup({
                        key: "{{ paystack_public_key }}",
                        email: "{{ store.email }}",
                        amount: amountInPesewas,
                        ref: initData.data.reference,
                        callback: async function(response) {
                            alert("Payment successful! Fulfilling data bundle...");
                            const fulfillRes = await fetch('/api/fulfill-order', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ reference: response.reference, phoneNumber, network, capacity })
                            });
                            const fulfillData = await fulfillRes.json();
                            if (fulfillData.status === 'success') {
                                alert("Data bundle order placed successfully!");
                            } else {
                                alert("Order error: " + (fulfillData.message || "Check backend logs"));
                            }
                        },
                        onClose: function() {
                            alert('Transaction was closed.');
                        }
                    });
                    handler.openIzu();
                } else {
                    alert("Initialization failed: " + initData.message);
                }
            } catch (err) {
                alert("Network error: " + err.message);
            }
        });
    </script>
</body>
</html>
